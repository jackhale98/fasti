<title>Kalends</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400&family=Young+Serif&display=swap">
<style>
/* Layout: phone = one column, bottom tabs, sheets for detail and quick add.
   Desktop (>=960px) = nav rail | working view | inspector that explains the selection. */
:root {
  --paper: #F2F4F1;
  --surface: #FFFFFF;
  --sunk: #E7ECE7;
  --ink: #13221C;
  --ink-2: #485851;
  --ink-3: #75847D;
  --rule: #D6DED8;
  --ledger: #1E5B49;
  --ledger-ink: #FFFFFF;
  --ledger-soft: #DCEAE3;
  --mark: #F3D04A;
  --mark-ink: #2E2500;
  --danger: #B42318;
  --danger-soft: #FBE4E1;
  --hatch: rgba(19, 34, 28, .09);
  --sx-kw: #1E5B49;
  --sx-date: #4A3DB0;
  --sx-num: #A04F06;
  --sx-time: #0A6585;
  --sx-str: #8B2D6C;
  --sx-expr: #5C5A0A;
  --shadow: 0 1px 2px rgba(19, 34, 28, .06), 0 8px 24px rgba(19, 34, 28, .08);
  --font-display: 'Young Serif', 'Iowan Old Style', Georgia, serif;
  --font-ui: 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  --ed-size: 16px;
  --tabbar-h: 64px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0D1411; --surface: #141D19; --sunk: #1B2621; --ink: #E3ECE6; --ink-2: #A7B6AE; --ink-3: #73827A; --rule: #26342D;
    --ledger: #6BC29F; --ledger-ink: #08160F; --ledger-soft: #1C3A2F; --mark: #E6C445; --mark-ink: #1D1700; --danger: #F2897E; --danger-soft: #3B1C19;
    --hatch: rgba(227, 236, 230, .08); --sx-kw: #6BC29F; --sx-date: #ABA0FF; --sx-num: #F0A460; --sx-time: #6CC7E8; --sx-str: #E68CC8; --sx-expr: #D6D27A;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .35); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0D1411; --surface: #141D19; --sunk: #1B2621; --ink: #E3ECE6; --ink-2: #A7B6AE; --ink-3: #73827A; --rule: #26342D;
  --ledger: #6BC29F; --ledger-ink: #08160F; --ledger-soft: #1C3A2F; --mark: #E6C445; --mark-ink: #1D1700; --danger: #F2897E; --danger-soft: #3B1C19;
  --hatch: rgba(227, 236, 230, .08); --sx-kw: #6BC29F; --sx-date: #ABA0FF; --sx-num: #F0A460; --sx-time: #6CC7E8; --sx-str: #E68CC8; --sx-expr: #D6D27A;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .35); color-scheme: dark;
}
@media (min-width: 720px) { :root { --ed-size: 14px; } }

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--paper); color: var(--ink); font: 15px/1.45 var(--font-ui); -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--ledger); outline-offset: 2px; }
.mono { font-family: var(--font-mono); }
[hidden] { display: none !important; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- shell ---------- */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--paper);
  display: flex; align-items: center; gap: 12px; padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  border-bottom: 1px solid var(--rule);
}
.brand { display: flex; align-items: baseline; gap: 8px; font-family: var(--font-display); font-size: 22px; letter-spacing: -.01em; line-height: 1; }
.brand-mark { width: 22px; height: 22px; align-self: center; flex: none; }
.brand small { font-family: var(--font-ui); font-size: 12px; color: var(--ink-3); letter-spacing: .02em; }
.syncpill {
  margin-left: auto; display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--rule); background: var(--surface);
  border-radius: 999px; padding: 5px 10px; font-size: 12.5px; color: var(--ink-2); white-space: nowrap;
}
.syncpill i { width: 7px; height: 7px; border-radius: 50%; background: var(--ledger); }
.syncpill.dirty i { background: var(--mark); box-shadow: 0 0 0 2px color-mix(in srgb, var(--mark) 35%, transparent); }

.nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--surface); border-top: 1px solid var(--rule);
  display: grid; grid-template-columns: repeat(4, 1fr);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px));
}
.nav .rail-head, .nav .rail-foot { display: none; }
.navbtn {
  height: var(--tabbar-h); border: 0; background: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  color: var(--ink-3); font-size: 11.5px; font-weight: 600; letter-spacing: .02em; position: relative;
}
.navbtn svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.navbtn[aria-current="page"] { color: var(--ink); }
.navbtn[aria-current="page"]::after { content: ""; position: absolute; top: 0; left: 30%; right: 30%; height: 3px; border-radius: 0 0 3px 3px; background: var(--ledger); }
.navbtn .badge { position: absolute; top: 10px; left: calc(50% + 8px); min-width: 16px; height: 16px; border-radius: 8px; background: var(--danger); color: var(--surface); font-size: 10px; display: grid; place-items: center; padding: 0 4px; }

main { padding-bottom: calc(var(--tabbar-h) + 88px + env(safe-area-inset-bottom, 0px)); }
.view { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 8px; max-width: 760px; margin: 0 auto; }
#panel { display: none; }

.fab {
  position: fixed; z-index: 7; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(var(--tabbar-h) + 16px + env(safe-area-inset-bottom, 0px));
  height: 54px; padding: 0 20px 0 16px; border-radius: 27px; border: 0; background: var(--ledger); color: var(--ledger-ink);
  display: inline-flex; align-items: center; gap: 8px; font-weight: 700; font-size: 15px; box-shadow: var(--shadow);
}
.fab svg { width: 22px; height: 22px; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; fill: none; }

.rail-new { display: none; }
@media (min-width: 960px) {
  #app { display: grid; grid-template-columns: 236px minmax(0, 1fr) 392px; height: 100%; }
  .topbar, .fab { display: none; }
  .nav { position: static; display: flex; flex-direction: column; gap: 2px; border-top: 0; border-right: 1px solid var(--rule); padding: 20px 14px; background: var(--paper); overflow: auto; }
  .nav .rail-head { display: flex; flex-direction: column; gap: 18px; padding: 4px 6px 18px; }
  .nav .rail-head .syncpill { margin-left: 0; align-self: flex-start; }
  .nav .rail-foot { display: block; margin-top: auto; padding: 12px 6px 0; font-size: 12px; color: var(--ink-3); line-height: 1.5; }
  .navbtn { height: 40px; flex-direction: row; justify-content: flex-start; gap: 12px; padding: 0 12px; border-radius: 10px; font-size: 14.5px; letter-spacing: 0; font-weight: 600; }
  .navbtn svg { width: 20px; height: 20px; }
  .navbtn:hover { background: var(--sunk); }
  .navbtn[aria-current="page"] { background: var(--surface); box-shadow: inset 0 0 0 1px var(--rule); }
  .navbtn[aria-current="page"]::after { display: none; }
  .navbtn .badge { position: static; margin-left: auto; }
  .rail-new { margin: 0 0 14px; height: 42px; border: 0; border-radius: 10px; background: var(--ledger); color: var(--ledger-ink); font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; }
  .rail-new svg { width: 18px; height: 18px; stroke: currentColor; stroke-width: 2.2; fill: none; stroke-linecap: round; }
  main { overflow: auto; padding-bottom: 40px; }
  .view { padding-block: 32px 24px; padding-left: 40px; padding-right: 40px; }
  #panel { display: block; overflow: auto; border-left: 1px solid var(--rule); background: var(--surface); padding: 28px 24px 40px; }
}

/* ---------- type ---------- */
.eyebrow { font-size: 11.5px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--ink-3); margin: 0; }
h1.display { font-family: var(--font-display); font-weight: 400; font-size: clamp(34px, 9vw, 48px); line-height: 1.02; letter-spacing: -.015em; margin: 4px 0 0; text-wrap: balance; }
h2 { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); font-weight: 700; margin: 0; }
.lede { color: var(--ink-2); margin: 6px 0 0; }
.banner { font-family: var(--font-mono); font-size: 12px; color: var(--ink-3); margin: 0 0 10px; overflow-wrap: anywhere; }

/* ---------- today ---------- */
.dayhead { display: grid; gap: 2px; margin-bottom: 22px; }
.dayhead .sub { color: var(--ink-2); margin: 6px 0 0; font-size: 15px; }
.dayhead .display span { background: linear-gradient(transparent 58%, color-mix(in srgb, var(--mark) 70%, transparent) 58%, color-mix(in srgb, var(--mark) 70%, transparent) 92%, transparent 92%); padding: 0 .06em; }
.sec { margin-top: 26px; }
.sec-h { display: flex; align-items: baseline; gap: 10px; margin-bottom: 6px; }
.sec-h .count { font-size: 12px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.list { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--rule); }
.item { display: flex; align-items: stretch; border-bottom: 1px solid var(--rule); }
.item-main { flex: 1; min-width: 0; display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 12px; align-items: start; text-align: left; border: 0; background: none; padding: 12px 4px; border-radius: 8px; }
.item-main:hover { background: color-mix(in srgb, var(--sunk) 60%, transparent); }
.item.sel .item-main { background: var(--ledger-soft); }
.when { font-variant-numeric: tabular-nums; font-weight: 600; font-size: 14px; line-height: 1.35; padding-top: 1px; }
.when small { display: block; font-weight: 500; color: var(--ink-3); font-size: 12px; }
.when.late { color: var(--danger); }
.what { min-width: 0; }
.msg { font-size: 16px; font-weight: 500; line-height: 1.35; overflow-wrap: anywhere; }
.meta { display: flex; flex-wrap: wrap; gap: 4px 10px; margin-top: 3px; font-size: 12.5px; color: var(--ink-3); }
.meta .src { font-family: var(--font-mono); font-size: 11.5px; }
.tag { display: inline-flex; align-items: center; gap: 4px; }
.check { flex: none; width: 52px; border: 0; background: none; display: grid; place-items: center; }
.check span { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--ink-3); display: grid; place-items: center; transition: background .15s, border-color .15s; }
.check:hover span { border-color: var(--ledger); }
.check svg { width: 13px; height: 13px; stroke: var(--ledger-ink); stroke-width: 3; fill: none; opacity: 0; }
.check.done span { background: var(--ledger); border-color: var(--ledger); }
.check.done svg { opacity: 1; }
.dayrow-h { display: flex; align-items: baseline; gap: 10px; padding: 14px 4px 4px; }
.dayrow-h b { font-weight: 700; font-size: 14px; }
.dayrow-h span { color: var(--ink-3); font-size: 12.5px; }
.dayrow-h .off { margin-left: auto; font-size: 11.5px; font-weight: 600; color: var(--ink-2); background: var(--sunk); border-radius: 6px; padding: 2px 7px; }
.empty { color: var(--ink-3); padding: 14px 4px; margin: 0; border-bottom: 1px solid var(--rule); }

/* ---------- month ---------- */
.monthhead { display: flex; align-items: end; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
.monthhead .display { margin: 0; }
.monthhead .yr { font-family: var(--font-display); font-size: 22px; color: var(--ink-3); padding-bottom: 4px; }
.mnav { margin-left: auto; display: flex; gap: 6px; }
.iconbtn { height: 36px; min-width: 36px; padding: 0 10px; border-radius: 10px; border: 1px solid var(--rule); background: var(--surface); display: inline-grid; place-items: center; font-weight: 600; font-size: 13.5px; }
.iconbtn svg { width: 18px; height: 18px; stroke: currentColor; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); border-top: 1px solid var(--rule); border-left: 1px solid var(--rule); background: var(--surface); border-radius: 12px; overflow: hidden; box-shadow: inset 0 0 0 1px var(--rule); }
.grid .wh { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); padding: 8px 6px; border-right: 1px solid var(--rule); border-bottom: 1px solid var(--rule); text-align: center; }
.cell { position: relative; min-height: 58px; border: 0; border-right: 1px solid var(--rule); border-bottom: 1px solid var(--rule); background: transparent; padding: 6px 4px 6px; text-align: left; display: flex; flex-direction: column; gap: 3px; align-items: stretch; min-width: 0; }
.cell.offwd { background: color-mix(in srgb, var(--sunk) 55%, transparent); }
.cell.offdate { background-image: repeating-linear-gradient(135deg, var(--hatch) 0 2px, transparent 2px 7px); }
.cell.out .dn { color: var(--ink-3); opacity: .6; }
.cell .dn { font-variant-numeric: tabular-nums; font-weight: 600; font-size: 13.5px; align-self: center; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; }
.cell.today .dn { background: var(--mark); color: var(--mark-ink); }
.cell.sel { box-shadow: inset 0 0 0 2px var(--ledger); }
.dots { display: flex; justify-content: center; gap: 3px; flex-wrap: wrap; }
.dots i { width: 5px; height: 5px; border-radius: 50%; background: var(--ledger); }
.dots i.todo { background: transparent; box-shadow: inset 0 0 0 1.5px var(--danger); }
.dots i.hol { background: var(--ink-3); }
.dots i.done { background: var(--rule); }
.lbls { display: none; }
@media (min-width: 720px) {
  .cell { min-height: 108px; padding: 6px; }
  .cell .dn { align-self: flex-start; }
  .dots { display: none; }
  .lbls { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .lbls span { font-size: 11.5px; line-height: 1.3; padding: 1px 5px; border-radius: 4px; background: var(--ledger-soft); color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lbls span.todo { background: var(--danger-soft); }
  .lbls span.hol { background: var(--sunk); color: var(--ink-2); }
  .lbls span.done { background: var(--sunk); color: var(--ink-3); text-decoration: line-through; }
  .lbls em { font-style: normal; font-size: 11px; color: var(--ink-3); padding-left: 5px; }
}
.legend { display: flex; flex-wrap: wrap; gap: 8px 16px; margin: 10px 2px 0; font-size: 12.5px; color: var(--ink-2); }
.legend i { display: inline-block; width: 14px; height: 14px; border-radius: 3px; vertical-align: -2px; margin-right: 6px; border: 1px solid var(--rule); }
.legend .lw { background: color-mix(in srgb, var(--sunk) 55%, var(--surface)); }
.legend .ld { background-color: var(--surface); background-image: repeating-linear-gradient(135deg, var(--hatch) 0 2px, transparent 2px 7px); }
.legend .lt { background: var(--mark); border-color: transparent; border-radius: 50%; }

/* ---------- code / syntax ---------- */
.sx-cmd { color: var(--ink); }
.sx-kw { color: var(--sx-kw); }
.sx-date, .sx-wday { color: var(--sx-date); }
.sx-num { color: var(--sx-num); }
.sx-time { color: var(--sx-time); }
.sx-str { color: var(--sx-str); }
.sx-name { color: var(--ink-2); }
.sx-expr { color: var(--sx-expr); }
.sx-pct { color: var(--sx-kw); text-decoration: underline; text-decoration-color: color-mix(in srgb, var(--sx-kw) 45%, transparent); text-underline-offset: 3px; }
.sx-com { color: var(--ink-3); }
.sx-err { text-decoration: wavy underline var(--danger); text-decoration-skip-ink: none; text-underline-offset: 3px; }
.remline { font-family: var(--font-mono); font-size: 13.5px; line-height: 1.6; background: var(--sunk); border-radius: 10px; padding: 10px 12px; white-space: pre-wrap; overflow-wrap: anywhere; margin: 0; }

/* ---------- script editor ---------- */
.filetabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; margin: 14px 0 10px; scrollbar-width: none; }
.filetab { flex: none; height: 34px; padding: 0 12px; border-radius: 9px; border: 1px solid var(--rule); background: var(--surface); font-family: var(--font-mono); font-size: 12.5px; color: var(--ink-2); display: inline-flex; align-items: center; gap: 6px; }
.filetab[aria-selected="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.filetab i { width: 6px; height: 6px; border-radius: 50%; background: var(--mark); }
.keys { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin-bottom: 8px; }
.key { flex: none; height: 32px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--rule); background: var(--surface); font-family: var(--font-mono); font-size: 12.5px; }
.editor { position: relative; background: var(--surface); border: 1px solid var(--rule); border-radius: 12px; overflow: hidden; }
.editor pre, .editor textarea {
  margin: 0; border: 0; width: 100%; font-family: var(--font-mono); font-size: var(--ed-size); font-weight: 400; line-height: 1.6; letter-spacing: 0;
  padding: 12px 12px 14px 46px; white-space: pre-wrap; overflow-wrap: anywhere; word-break: normal; tab-size: 8; font-variant-ligatures: none;
}
.editor pre { position: absolute; inset: 0; pointer-events: none; color: var(--ink); overflow: hidden; }
.editor textarea { position: relative; display: block; background: transparent; color: transparent; -webkit-text-fill-color: transparent; caret-color: var(--ink); resize: none; outline: none; overflow: hidden; min-height: 320px; }
.editor textarea::selection { background: color-mix(in srgb, var(--ledger) 28%, transparent); -webkit-text-fill-color: transparent; }
.ln { position: relative; min-height: 1.6em; }
.ln::before { content: attr(data-n); white-space: nowrap; position: absolute; left: -46px; width: 34px; text-align: right; color: var(--ink-3); font-size: .78em; opacity: .75; }
.ln.cur { background: color-mix(in srgb, var(--ledger-soft) 70%, transparent); box-shadow: -46px 0 0 color-mix(in srgb, var(--ledger-soft) 70%, transparent); }
.ln.err::before { color: var(--danger); opacity: 1; content: "●  " attr(data-n); }
.ln.eng::before { content: "◇ " attr(data-n); }
.statusline { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12.5px; color: var(--ink-3); margin: 8px 2px 0; }
.statusline b { color: var(--ink-2); font-weight: 600; }
.inspector { margin-top: 18px; }
.problems { margin-top: 18px; display: grid; gap: 6px; }
.problem { text-align: left; border: 1px solid color-mix(in srgb, var(--danger) 35%, var(--rule)); background: var(--danger-soft); border-radius: 10px; padding: 9px 12px; font-size: 13.5px; }
.problem b { font-family: var(--font-mono); font-weight: 400; font-size: 12px; margin-right: 6px; }
@media (min-width: 960px) { .inspector.mobile-only { display: none; } }

/* ---------- detail / inspector ---------- */
.detail { display: grid; gap: 18px; }
.detail h3 { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); font-weight: 700; margin: 0 0 8px; }
.detail .title { font-size: 22px; font-weight: 600; line-height: 1.25; margin: 4px 0 0; overflow-wrap: anywhere; text-wrap: balance; }
.detail .due { color: var(--ink-2); margin: 6px 0 0; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 12.5px; border-radius: 999px; padding: 4px 10px; background: var(--sunk); color: var(--ink-2); }
.chip.warn { background: var(--danger-soft); color: var(--danger); font-weight: 600; }
.explain { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; }
.explain li { padding-left: 16px; position: relative; color: var(--ink); }
.explain li::before { content: ""; position: absolute; left: 2px; top: .62em; width: 6px; height: 6px; border-radius: 2px; background: var(--ledger); }
.nextdates { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 6px; }
.nextdates span { font-size: 13px; font-variant-numeric: tabular-nums; background: var(--paper); border: 1px solid var(--rule); border-radius: 8px; padding: 6px 9px; }
.nextdates span.first { border-color: var(--ledger); color: var(--ledger); font-weight: 600; }
.lineedit { width: 100%; min-height: 84px; border: 1px solid var(--rule); border-radius: 10px; background: var(--paper); padding: 10px 12px; font-family: var(--font-mono); font-size: max(16px, 13.5px); line-height: 1.55; resize: vertical; }
@media (min-width: 720px) { .lineedit { font-size: 13.5px; } }
.lineerr { color: var(--danger); font-size: 13.5px; margin: 6px 0 0; }
.lineok { color: var(--ink-2); font-size: 13px; margin: 6px 0 0; }
.btns { display: flex; flex-wrap: wrap; gap: 8px; }
.btn { height: 40px; padding: 0 16px; border-radius: 10px; border: 1px solid var(--rule); background: var(--surface); font-weight: 600; font-size: 14px; display: inline-flex; align-items: center; gap: 8px; }
.btn.primary { background: var(--ledger); color: var(--ledger-ink); border-color: var(--ledger); }
.btn.danger { color: var(--danger); }
.btn:disabled { opacity: .45; cursor: default; }
.note { font-size: 13px; color: var(--ink-2); background: var(--paper); border: 1px dashed var(--rule); border-radius: 10px; padding: 10px 12px; margin: 0; }
.panel-empty { color: var(--ink-2); }
.panel-empty h2 { margin-bottom: 10px; }
.offlist { list-style: none; margin: 10px 0 0; padding: 0; border-top: 1px solid var(--rule); }
.offlist li { display: flex; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--rule); font-size: 14px; }
.offlist time { width: 92px; flex: none; color: var(--ink-3); font-variant-numeric: tabular-nums; }

/* ---------- sync ---------- */
.card { background: var(--surface); border: 1px solid var(--rule); border-radius: 14px; padding: 16px; }
.source { display: grid; gap: 12px; }
.source-h { display: flex; align-items: center; gap: 12px; }
.source-h svg { width: 34px; height: 34px; flex: none; }
.source-h b { display: block; font-size: 16px; }
.source-h span { font-size: 13px; color: var(--ink-2); overflow-wrap: anywhere; }
.status { margin-left: auto; font-size: 12px; font-weight: 700; color: var(--ledger); background: var(--ledger-soft); padding: 3px 9px; border-radius: 999px; }
.commit { width: 100%; height: 40px; border: 1px solid var(--rule); border-radius: 10px; background: var(--paper); padding: 0 12px; font-size: 16px; }
@media (min-width: 720px) { .commit { font-size: 14px; } }
.diff { border: 1px solid var(--rule); border-radius: 12px; overflow: hidden; margin-top: 10px; background: var(--surface); }
.diff-h { font-family: var(--font-mono); font-size: 12.5px; padding: 8px 12px; background: var(--sunk); display: flex; gap: 10px; }
.diff-h span { margin-left: auto; color: var(--ink-3); }
.diff pre { margin: 0; overflow-x: auto; font-family: var(--font-mono); font-size: 12.5px; line-height: 1.6; }
.diff .dl { display: block; padding: 0 12px; white-space: pre; }
.diff .dl.add { background: color-mix(in srgb, var(--ledger) 14%, transparent); }
.diff .dl.del { background: color-mix(in srgb, var(--danger) 12%, transparent); }
.diff .dl.gap { color: var(--ink-3); background: var(--paper); }
.providers { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 8px; }
.provider { display: flex; align-items: center; gap: 12px; background: var(--surface); border: 1px solid var(--rule); border-radius: 12px; padding: 12px 14px; }
.provider svg { width: 28px; height: 28px; flex: none; }
.provider div { min-width: 0; flex: 1; }
.provider b { display: block; font-size: 15px; }
.provider span { font-size: 13px; color: var(--ink-2); }
.steps { margin: 10px 0 0; padding: 0; list-style: none; display: grid; gap: 12px; counter-reset: s; }
.steps li { counter-increment: s; display: grid; grid-template-columns: 28px 1fr; gap: 10px; }
.steps li::before { content: counter(s); width: 26px; height: 26px; border-radius: 50%; border: 1px solid var(--rule); display: grid; place-items: center; font-size: 12.5px; font-weight: 700; color: var(--ink-2); }
.steps b { display: block; }
.steps span { color: var(--ink-2); font-size: 14px; }
.engine { display: grid; gap: 6px; font-size: 14px; color: var(--ink-2); }
.engine code { font-family: var(--font-mono); font-size: 12.5px; background: var(--sunk); border-radius: 5px; padding: 1px 5px; color: var(--ink); }

/* ---------- sheet ---------- */
.backdrop { position: fixed; inset: 0; z-index: 20; background: color-mix(in srgb, #000 38%, transparent); display: flex; align-items: flex-end; justify-content: center; }
.sheet {
  width: 100%; max-height: calc(100% - 28px - env(safe-area-inset-top, 0px)); overflow: auto; background: var(--surface); border-radius: 18px 18px 0 0;
  padding: 10px max(18px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px));
  box-shadow: var(--shadow); animation: up .22s ease-out; overscroll-behavior: contain;
}
.sheet .grab { width: 40px; height: 5px; border-radius: 3px; background: var(--rule); margin: 0 auto 10px; }
.sheet-h { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.sheet-h h2 { font-family: var(--font-display); font-size: 24px; text-transform: none; letter-spacing: -.01em; color: var(--ink); font-weight: 400; }
.sheet-h .iconbtn { margin-left: auto; }
@keyframes up { from { transform: translateY(24px); opacity: .4; } to { transform: none; opacity: 1; } }
@media (min-width: 960px) {
  .backdrop { align-items: center; }
  .sheet { width: min(600px, 92vw); border-radius: 18px; max-height: 88vh; padding: 20px 24px 24px; }
  .sheet .grab { display: none; }
}
@media (prefers-reduced-motion: reduce) { .sheet { animation: none; } .check span { transition: none; } }

/* ---------- compose ---------- */
.qa { width: 100%; height: 52px; border-radius: 12px; border: 1.5px solid var(--ledger); background: var(--paper); padding: 0 14px; font-size: 17px; }
.qa::placeholder { color: var(--ink-3); }
.hint { font-size: 12.5px; color: var(--ink-3); margin: 6px 2px 14px; }
.result { display: grid; gap: 10px; margin-bottom: 14px; }
.tune { border-top: 1px solid var(--rule); padding-top: 12px; }
.tune summary { font-weight: 700; font-size: 14px; cursor: pointer; list-style: none; display: flex; align-items: center; gap: 8px; }
.tune summary::-webkit-details-marker { display: none; }
.tune summary::after { content: "Show"; margin-left: auto; font-weight: 600; font-size: 13px; color: var(--ledger); }
.tune[open] summary::after { content: "Hide"; }
.form { display: grid; gap: 12px; margin-top: 12px; }
.row { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 10px; align-items: center; }
.row > label, .row > .lab { font-size: 13.5px; color: var(--ink-2); font-weight: 600; }
.row input[type=text], .row input[type=number], .row input[type=date], .row input[type=time], .row select {
  height: 40px; border-radius: 9px; border: 1px solid var(--rule); background: var(--paper); padding: 0 10px; font-size: 16px; width: 100%; min-width: 0;
}
@media (min-width: 720px) { .row input[type=text], .row input[type=number], .row input[type=date], .row input[type=time], .row select { font-size: 14px; } }
.inline { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; min-width: 0; }
.inline > * { flex: 1 1 130px; }
@media (max-width: 480px) { .row { grid-template-columns: minmax(0, 1fr); gap: 6px; } }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button { height: 34px; padding: 0 11px; border-radius: 8px; border: 1px solid var(--rule); background: var(--paper); font-size: 13.5px; font-weight: 600; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--paper); }
.seg.wd button { width: 40px; padding: 0; }
.tick { display: flex; gap: 8px; align-items: center; font-size: 14px; }
.tick input { width: 18px; height: 18px; accent-color: var(--ledger); }
.compose-foot { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 16px; }
.compose-foot select { height: 40px; border-radius: 9px; border: 1px solid var(--rule); background: var(--paper); padding: 0 10px; font-family: var(--font-mono); font-size: 14px; }
.compose-foot .btn.primary { margin-left: auto; }

/* ---------- toast ---------- */
.toast {
  position: fixed; z-index: 30; left: 50%; transform: translateX(-50%); bottom: calc(var(--tabbar-h) + 84px + env(safe-area-inset-bottom, 0px));
  background: var(--ink); color: var(--paper); border-radius: 12px; padding: 10px 12px 10px 16px; display: flex; align-items: center; gap: 12px;
  font-size: 14px; max-width: calc(100% - 32px); box-shadow: var(--shadow);
}
.toast button { border: 0; background: none; color: var(--mark); font-weight: 700; padding: 4px 6px; }
@media (min-width: 960px) { .toast { bottom: 28px; } }

<script>/* =====================================================================
   Kalends preview engine
   A faithful subset of Remind 06.03 trigger computation, written in JS
   so the demo runs anywhere. In production this is replaced by the real
   Remind binary compiled to WebAssembly (remind -ppp / --json).
   Dates are day numbers since 1990-01-01, exactly as Remind stores them.
   ===================================================================== */
const K = (() => {
  const BASE = Date.UTC(1990, 0, 1) / 86400000;
  const WD = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
  const MO = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
  const dnum = (y, m, d) => Date.UTC(y, m - 1, d) / 86400000 - BASE;
  const ymd = n => { const t = new Date((n + BASE) * 86400000); return { y: t.getUTCFullYear(), m: t.getUTCMonth() + 1, d: t.getUTCDate() }; };
  const wday = n => (((n + 1) % 7) + 7) % 7; // 0 = Sunday; 1990-01-01 was a Monday
  const dim = (y, m) => new Date(Date.UTC(y, m, 0)).getUTCDate();
  const p2 = v => String(v).padStart(2, '0');
  const iso = n => { const { y, m, d } = ymd(n); return `${y}-${p2(m)}-${p2(d)}`; };
  const MAXDAY = dnum(2075, 12, 31);

  function nameIndex(tok, list) {
    const t = tok.toLowerCase();
    if (t.length < 3) return -1;
    for (let i = 0; i < list.length; i++) if (list[i].toLowerCase().startsWith(t)) return i;
    return -1;
  }
  const wdIndex = t => nameIndex(t, WD);
  const moIndex = t => nameIndex(t, MO);

  /* ---------- tokenizer: whitespace tokens, "strings", [expressions] ---------- */
  function tokenize(line) {
    const toks = []; let i = 0; const L = line.length;
    while (i < L) {
      while (i < L && /\s/.test(line[i])) i++;
      if (i >= L) break;
      const s = i;
      if (line[i] === '"') {
        i++; while (i < L && line[i] !== '"') { if (line[i] === '\\') i++; i++; } i++;
      } else if (line[i] === '[') {
        let depth = 0;
        while (i < L) {
          const c = line[i];
          if (c === '[') depth++;
          else if (c === ']') { depth--; if (depth === 0) { i++; break; } }
          else if (c === '"') { i++; while (i < L && line[i] !== '"') { if (line[i] === '\\') i++; i++; } }
          i++;
        }
        while (i < L && !/\s/.test(line[i])) i++;
      } else {
        while (i < L && !/\s/.test(line[i])) i++;
      }
      toks.push({ t: line.slice(s, Math.min(i, L)), s, e: Math.min(i, L), role: 'plain' });
    }
    return toks;
  }

  const BODY_KW = new Set(['MSG', 'MSF', 'FMT', 'RUN', 'CAL', 'PS', 'PSFILE', 'SPECIAL', 'SATISFY']);
  const ISO_RE = /^(\d{4})[-/](\d{1,2})[-/](\d{1,2})(?:@(\d{1,2})[:.](\d{2})(am?|pm?)?)?$/i;

  function parseTime(s) {
    const m = /^(\d{1,2})[:.](\d{2})\s*(am?|pm?)?$/i.exec(s);
    if (!m) return null;
    let h = +m[1]; const mi = +m[2]; const ap = m[3] && m[3][0].toLowerCase();
    if (mi > 59) return null;
    if (ap) { if (h < 1 || h > 12) return null; if (ap === 'a') h = h % 12; else h = (h % 12) + 12; }
    else if (h > 23) return null;
    return h * 60 + mi;
  }
  function parseDuration(s) {
    let m = /^(\d+)[:.](\d{2})$/.exec(s); if (m) return +m[1] * 60 + +m[2];
    m = /^\d+$/.exec(s); if (m) return +s;
    return null;
  }

  class ParseError extends Error { constructor(msg, tok) { super(msg); this.tok = tok; } }

  /* Parse a full date from tokens starting at i: ISO or day/month/year in any order. */
  function parseDateClause(toks, i, what) {
    const t = toks[i];
    if (!t) throw new ParseError(`${what} needs a date after it`, toks[i - 1]);
    if (t.t[0] === '[') { t.role = 'expr'; return { n: null, next: i + 1, expr: true }; }
    const iso = ISO_RE.exec(t.t);
    if (iso) {
      const y = +iso[1], m = +iso[2], d = +iso[3];
      if (m < 1 || m > 12 || d < 1 || d > dim(y, m)) throw new ParseError(`${t.t} is not a real date`, t);
      t.role = 'date'; return { n: dnum(y, m, d), next: i + 1 };
    }
    let d = null, m = null, y = null, j = i;
    while (j < toks.length && (d == null || m == null || y == null)) {
      const tk = toks[j]; let used = false;
      if (/^\d+$/.test(tk.t)) {
        const v = +tk.t;
        if (d == null && v >= 1 && v <= 31) { d = v; used = true; }
        else if (y == null && v >= 1990 && v <= 2075) { y = v; used = true; }
      } else if (m == null && moIndex(tk.t) >= 0) { m = moIndex(tk.t) + 1; used = true; }
      if (!used) break;
      tk.role = 'date'; j++;
    }
    if (d == null || m == null || y == null) throw new ParseError(`${what} needs a complete date, like 2026-12-11 or 11 Dec 2026`, toks[i]);
    if (d > dim(y, m)) throw new ParseError(`${d} ${MO[m - 1]} ${y} is not a real date`, toks[i]);
    return { n: dnum(y, m, d), next: j };
  }

  /* ---------------------------- REM ---------------------------- */
  function parseRem(text, toks) {
    const rem = {
      spec: { d: null, m: null, y: null, wd: null }, back: 0, backDouble: false, delta: 0, deltaDouble: false,
      rep: 0, todo: false, maxOverdue: null, complete: null, prio: 5000, omitMode: null, localWd: null,
      addomit: false, noqueue: false, once: false, at: null, tdelta: 0, trep: 0, until: null, through: null,
      from: null, duration: null, tags: [], info: {}, tz: null, type: null, special: null, body: '', bodyStart: text.length,
      sugar: null, engine: [], warnings: []
    };
    toks[0].role = 'cmd';
    let i = 1; let ordinal = null; let tilde = null; let lastday = null;
    const setPart = (k, v, tk, label) => {
      if (rem.spec[k] != null) throw new ParseError(`The ${label} is given twice`, tk);
      rem.spec[k] = v;
    };
    while (i < toks.length) {
      const tk = toks[i]; const t = tk.t; const U = t.toUpperCase();
      if (BODY_KW.has(U)) {
        tk.role = 'kw';
        if (U === 'SATISFY') { rem.engine.push('SATISFY'); rem.type = 'SATISFY'; }
        else rem.type = U;
        let bs = tk.e;
        if (U === 'SPECIAL') {
          const nx = toks[i + 1];
          if (!nx) throw new ParseError('SPECIAL needs a type, like COLOR', tk);
          nx.role = 'name'; rem.special = nx.t; bs = nx.e;
        }
        while (bs < text.length && /\s/.test(text[bs])) bs++;
        rem.bodyStart = bs; rem.body = text.slice(bs);
        break;
      }
      if (t[0] === '[') { tk.role = 'expr'; rem.engine.push('an expression'); i++; continue; }
      const iso = ISO_RE.exec(t);
      if (iso) {
        const y = +iso[1], m = +iso[2], d = +iso[3];
        if (m < 1 || m > 12 || d < 1 || d > dim(y, m)) throw new ParseError(`${t} is not a real date`, tk);
        if (y < 1990 || y > 2075) throw new ParseError('Remind handles years from 1990 to 2075', tk);
        setPart('y', y, tk, 'year'); setPart('m', m, tk, 'month'); setPart('d', d, tk, 'day');
        if (iso[4] != null) { const at = parseTime(`${iso[4]}:${iso[5]}${iso[6] || ''}`); if (at == null) throw new ParseError('That time is not valid', tk); rem.at = at; }
        tk.role = 'date'; i++; continue;
      }
      let m;
      if ((m = /^(\+\+|\+|--|-|\*|~~|~)(\d+)$/.exec(t))) {
        const v = +m[2]; tk.role = 'num';
        if (m[1][0] === '+') { if (rem.delta || rem.deltaDouble) throw new ParseError('Only one advance warning (+N) is allowed', tk); rem.delta = v; rem.deltaDouble = m[1] === '++'; }
        else if (m[1][0] === '-') { if (rem.back) throw new ParseError('Only one back (-N) is allowed', tk); rem.back = v; rem.backDouble = m[1] === '--'; }
        else if (m[1] === '*') { if (rem.rep) throw new ParseError('Only one repeat (*N) is allowed', tk); if (v < 1) throw new ParseError('A repeat must be at least *1', tk); rem.rep = v; }
        else { if (tilde) throw new ParseError('Only one ~N is allowed', tk); tilde = { n: v, double: m[1] === '~~' }; }
        i++; continue;
      }
      if (/^\d+$/.test(t)) {
        const v = +t;
        if (v >= 1 && v <= 31 && rem.spec.d == null) rem.spec.d = v;
        else if (v >= 1990 && v <= 2075 && rem.spec.y == null) rem.spec.y = v;
        else throw new ParseError(`${t} isn't a day (1–31) or a year (1990–2075) here`, tk);
        tk.role = 'date'; i++; continue;
      }
      switch (U) {
        case 'IN': tk.role = 'kw'; i++; continue;
        case 'ONCE': tk.role = 'kw'; rem.once = true; i++; continue;
        case 'TODO': tk.role = 'kw'; rem.todo = true; i++; continue;
        case 'ADDOMIT': tk.role = 'kw'; rem.addomit = true; i++; continue;
        case 'NOQUEUE': tk.role = 'kw'; rem.noqueue = true; i++; continue;
        case 'SKIP': case 'BEFORE': case 'AFTER':
          tk.role = 'kw';
          if (rem.omitMode) throw new ParseError('Use only one of SKIP, BEFORE or AFTER', tk);
          rem.omitMode = U; i++; continue;
        case 'LASTDAY': case 'LASTWORKDAY':
          tk.role = 'date'; if (lastday) throw new ParseError(`${t} is given twice`, tk);
          lastday = U === 'LASTDAY' ? 'day' : 'work'; i++; continue;
        case 'FIRST': case 'SECOND': case 'THIRD': case 'FOURTH': case 'LAST':
          tk.role = 'date'; if (ordinal) throw new ParseError('Only one of First/Second/Third/Fourth/Last is allowed', tk);
          ordinal = U === 'LAST' ? 'last' : ['FIRST', 'SECOND', 'THIRD', 'FOURTH'].indexOf(U) + 1; i++; continue;
        case 'PRIORITY': {
          tk.role = 'kw'; const nx = toks[i + 1];
          if (!nx || !/^\d+$/.test(nx.t) || +nx.t > 9999) throw new ParseError('PRIORITY needs a number from 0 to 9999', tk);
          nx.role = 'num'; rem.prio = +nx.t; i += 2; continue;
        }
        case 'MAX-OVERDUE': {
          tk.role = 'kw'; const nx = toks[i + 1];
          if (!nx || !/^\d+$/.test(nx.t)) throw new ParseError('MAX-OVERDUE needs a number of days', tk);
          nx.role = 'num'; rem.maxOverdue = +nx.t; i += 2; continue;
        }
        case 'COMPLETE-THROUGH': case 'COMPLETED-THROUGH': {
          tk.role = 'kw'; const r = parseDateClause(toks, i + 1, U); rem.complete = r.n; if (r.expr) rem.engine.push('an expression'); i = r.next; continue;
        }
        case 'UNTIL': case 'THROUGH': {
          tk.role = 'kw'; const r = parseDateClause(toks, i + 1, U);
          if (rem.until != null || rem.through != null) throw new ParseError('Use only one UNTIL or THROUGH', tk);
          if (r.expr) rem.engine.push('an expression');
          if (U === 'UNTIL') rem.until = r.n; else rem.through = r.n;
          i = r.next; continue;

`# Days off. Reminders that use SKIP, BEFORE, AFTER,

`REM ${maya.d} ${K.MOS[maya.m - 1]} +7 MSG Maya's birthday %b

  /* ---------------- syntax highlighting ---------------- */

  function changeCount() { let c = 0; for (const f of Object.keys(S.files)) if (S.files[f] !== S.base[f]) c += diffLines(S.base[f] ?? '', S.files[f]).filter(x => x.t !== ' ').length; return c; }
  const GH = '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="11" fill="var(--ink)"/><path fill="var(--paper)" d="M12 5.2a6.8 6.8 0 0 0-2.15 13.25c.34.06.46-.15.46-.33v-1.2c-1.9.41-2.3-.8-2.3-.8-.31-.79-.76-1-.76-1-.62-.42.05-.41.05-.41.68.05 1.04.7 1.04.7.61 1.04 1.6.74 1.99.57.06-.44.24-.74.43-.91-1.51-.17-3.1-.76-3.1-3.37 0-.74.27-1.35.7-1.83-.07-.17-.3-.86.07-1.8 0 0 .57-.18 1.87.7a6.5 6.5 0 0 1 3.4 0c1.3-.88 1.87-.7 1.87-.7.37.94.14 1.63.07 1.8.44.48.7 1.09.7 1.83 0 2.62-1.6 3.2-3.11 3.37.24.21.46.62.46 1.25v1.86c0 .18.12.4.47.33A6.8 6.8 0 0 0 12 5.2z"/></svg>';
  const ICON = (path, bg) => `<svg viewBox="0 0 24 24" aria-hidden="true"><rect width="24" height="24" rx="6" fill="${bg}"/>${path}</svg>`;
  function viewSync() {
    const changed = Object.keys(S.files).filter(f => S.files[f] !== S.base[f]);
    let diffs = '';
    for (const f of changed) {
      const d = diffLines(S.base[f] ?? '', S.files[f]); let html = ''; let lastShown = -2; let ln = 0;
      const show = new Set(); d.forEach((x, i) => { if (x.t !== ' ') for (let k = i - 1; k <= i + 1; k++) show.add(k); });
      d.forEach((x, i) => {
        if (x.t !== '-') ln++;
        if (!show.has(i)) return;
        if (lastShown >= 0 && i > lastShown + 1) html += `<span class="dl gap">⋯</span>`;
        html += `<span class="dl ${x.t === '+' ? 'add' : x.t === '-' ? 'del' : ''}">${x.t} ${esc(x.s) || ' '}</span>`; lastShown = i;
      });
      const adds = d.filter(x => x.t === '+').length, dels = d.filter(x => x.t === '-').length;
      diffs += `<div class="diff"><div class="diff-h">${esc(f)}<span>+${adds} −${dels}</span></div><pre>${html}</pre></div>`;

      <section class="sec"><div class="sec-h"><h2>Other places your files can live</h2></div>
        <ul class="providers">
          <li class="provider">${ICON('<circle cx="7" cy="7" r="2.2" fill="none" stroke="var(--paper)" stroke-width="1.6"/><circle cx="7" cy="17" r="2.2" fill="none" stroke="var(--paper)" stroke-width="1.6"/><circle cx="17" cy="10" r="2.2" fill="none" stroke="var(--paper)" stroke-width="1.6"/><path d="M7 9.2v5.6M17 12.2c0 3-4 2.5-8.3 4" fill="none" stroke="var(--paper)" stroke-width="1.6"/>', '#C2462B')}<div><b>Any git host</b><span>GitLab, Bitbucket, Gitea or your own server over HTTPS</span></div><button class="btn" data-act="connect">Connect</button></li>
          <li class="provider">${ICON('<path d="M7.5 6l4.5 2.9-4.5 2.9L3 8.9zM16.5 6L21 8.9l-4.5 2.9L12 8.9zM3 14.7l4.5-2.9 4.5 2.9-4.5 2.9zM16.5 11.8l4.5 2.9-4.5 2.9-4.5-2.9zM7.6 18.5l4.4-2.8 4.4 2.8-4.4 2.8z" fill="var(--paper)" transform="translate(0,-1)"/>', '#0F62C9')}<div><b>Dropbox</b><span>Syncs a few seconds after each edit</span></div><button class="btn" data-act="connect">Connect</button></li>
          <li class="provider">${ICON('<path d="M6.5 17.5h11a3.5 3.5 0 0 0 .4-7 5 5 0 0 0-9.5-1.3A4 4 0 0 0 6.5 17.5z" fill="var(--paper)"/>', '#0B66B5')}<div><b>OneDrive</b><span>Personal or SharePoint folders</span></div><button class="btn" data-act="connect">Connect</button></li>
          <li class="provider">${ICON('<circle cx="12" cy="12" r="6.5" fill="none" stroke="var(--paper)" stroke-width="1.6"/><path d="M5.5 12h13M12 5.5c2.2 2.4 2.2 10.6 0 13M12 5.5c-2.2 2.4-2.2 10.6 0 13" fill="none" stroke="var(--paper)" stroke-width="1.4"/>', '#3E5B53')}<div><b>WebDAV</b><span>Nextcloud, ownCloud, Fastmail Files, a NAS</span></div><button class="btn" data-act="connect">Connect</button></li>
        </ul></section>
      <section class="sec"><div class="sec-h"><h2>How it works</h2></div>
        <ol class="steps">

      <section class="sec"><div class="sec-h"><h2>Engine</h2></div>
        <div class="card engine">

  }

  /* ---------------- detail / inspector ---------------- */
  function itemDetail(it, tHint) {
    const rem = it.rem, L = it.L;
    let next = [], due = null, state = '';
    if (!it.engineOnly) {
      if (rem.todo) { const st = todoStart(rem); due = K.nextOccurrence(rem, st); next = K.upcoming(rem, st, 6); if (due != null) state = due < T ? 'overdue' : due === T ? 'due today' : ''; }
      else { due = K.nextOccurrence(rem, T, 3); next = K.upcoming(rem, T, 6); }
    }
    const t = tHint != null ? tHint : due;
    const title = t != null ? K.subst(rem, t, T, nowMin, 'agenda') : rem.body.replace(/%./g, '').trim();
    const chips = [];
    if (rem.at != null) chips.push(`<span class="chip">${K.fmt12(rem.at)}${rem.duration ? ' · ' + K.durText(rem.duration) : ''}</span>`);
    for (const [k, v] of Object.entries(rem.info)) chips.push(`<span class="chip">${esc(k)}: ${esc(v)}</span>`);
    rem.tags.forEach(tg => chips.push(`<span class="chip mono">TAG ${esc(tg)}</span>`));
    if (state === 'overdue') chips.unshift(`<span class="chip warn">${T - due} day${T - due === 1 ? '' : 's'} overdue</span>`);
    const eyebrow = it.engineOnly ? 'Needs the full engine' : rem.todo ? 'Task' : rem.fromOmit ? 'Holiday' : 'Reminder';
    let dueLine = '';
    if (due != null) { const ws = K.warnStart(rem, due); dueLine = `${rem.todo ? 'Due' : 'Next'} ${K.fmtDate(due)}${due !== T ? ' · ' + relDays(due) : ''}${ws < due ? ` · reminds from ${K.fmtDateShort(ws)}` : ''}`; }
    else if (!it.engineOnly) dueLine = rem.todo ? 'Done. No more occurrences.' : 'No future dates.';

      <div><p class="eyebrow">${eyebrow}</p><p class="title">${esc(title)}</p>${dueLine ? `<p class="due">${esc(dueLine)}</p>` : ''}</div>
      ${chips.length ? `<div class="chips">${chips.join('')}</div>` : ''}
      ${rem.todo && due != null ? `<div class="btns"><button class="btn primary" data-act="done" data-key="${esc(keyOf(it))}" data-t="${due}">Mark done through ${esc(K.fmtDateShort(due))}</button></div>` : ''}
      <div><h3>How Remind reads it</h3><ul class="explain">${K.explain(rem).map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>

        <div id="lineprev"><p class="lineok">Edit the line to see the new dates before you save.</p></div>
      </div>
      <div class="btns"><button class="btn primary" data-act="saveline" data-key="${esc(keyOf(it))}" id="savebtn" disabled>Save line</button><button class="btn" data-act="goto" data-file="${esc(it.file)}" data-line="${L.start}">Show in script</button><button class="btn danger" data-act="delline" data-key="${esc(keyOf(it))}">Delete</button></div>
    </div>`;
  }
  function linePreview(text, it) {
    const Ls = standalone(text).filter(l => l.kind !== 'blank');

    if (!L.rem) return { ok: true, html: '<p class="lineok">This line has no reminder in it.</p>' };
    L.rem.omitCtx = it ? it.rem.omitCtx : S.ctx.finalOmit;

    const st = L.rem.todo ? todoStart(L.rem) : T;

  }

  function lineInspector(file, phys) {
    const lines = S.ctx.lines[file]; if (!lines) return '';
    const L = lines.find(l => phys >= l.start && phys <= l.end); if (!L) return '';
    const lab = `<p class="eyebrow">Line ${L.start + 1}${L.end > L.start ? '–' + (L.end + 1) : ''} · ${esc(file)}</p>`;
    let body = '';
    const it = S.ctx.items.find(i => i.L === L);
    if (L.kind === 'error') body = `<p class="lineerr" style="font-size:15px">${esc(L.error)}</p><p class="note">Remind would stop on this line with an error. Everything else in the file still works.</p>`;
    else if (L.kind === 'comment') body = '<p class="lede">A comment. Remind ignores lines that start with # or ;.</p>';
    else if (L.kind === 'blank') body = '<p class="lede">Put the cursor on a line to see how Remind reads it.</p>';
    else if (L.kind === 'include') body = `<p class="lede">${L.note ? esc(L.note) : `Reads every reminder and holiday in <span class="mono">${esc(L.target)}</span> at this point, so its OMITs apply to the lines below.`}</p>${!L.note ? `<div class="btns" style="margin-top:10px"><button class="btn" data-act="file" data-file="${esc(L.target)}">Open ${esc(L.target)}</button></div>` : ''}`;

        ${it.engineOnly ? `<p class="note" style="margin-top:10px">${esc(L.note)}.</p>` : `<div style="margin-top:12px"><h3 class="eyebrow" style="margin-bottom:6px">${rem.todo ? 'Due dates' : 'Next dates'}</h3><div class="nextdates">${nx.map((n, i) => `<span class="${i === 0 ? 'first' : ''}">${K.fmtDateShort(n)}</span>`).join('') || '<span>None</span>'}</div></div>`}`;
      }

  }

  function panelDefault() {
    const offs = [];
    for (let n = T; n <= T + 90 && offs.length < 6; n++) if (K.omitReason(n, S.ctx.finalOmit) === 'date') offs.push(n);
    const items = S.ctx.items.length, eng = S.ctx.items.filter(i => i.engineOnly).length;

      <h2 style="margin-top:26px">Days off ahead</h2>

  }

  /* ---------------- render ---------------- */
  function renderNav() {
    document.querySelectorAll('.navbtn').forEach(b => b.setAttribute('aria-current', b.dataset.view === S.view ? 'page' : 'false'));
    const n = changeCount();
    for (const id of ['pill-m', 'pill-d']) { const p = $('#' + id); p.classList.toggle('dirty', n > 0); p.querySelector('span').textContent = n ? `${n} change${n === 1 ? '' : 's'} · not pushed` : 'Synced · main'; }

    const bt = $('#b-today'); bt.hidden = !over; bt.textContent = over;
    const errs = Object.values(S.ctx.lines).reduce((a, ls) => a + ls.filter(l => l.kind === 'error').length, 0);
    const bs = $('#b-script'); bs.hidden = !errs; bs.textContent = errs;
  }
  function renderView() {
    const v = $('#view');

  }
  function renderPanel() {

    const it = S.sel && findItem(S.sel.key);

  }
  function render() { renderNav(); renderView(); renderPanel(); if (S.sheet) renderSheet(); }

  /* ---------------- editor ---------------- */
  function physLineOf(text, pos) { let n = 0; for (let i = 0; i < pos; i++) if (text.charCodeAt(i) === 10) n++; return n; }
  function paintEditor() {
    const ta = $('#ed'); if (!ta) return;
    const lines = S.ctx.lines[S.file] || [];
    const nPhys = S.files[S.file].split('\n').length;
    const cur = S.caretLine ?? -1;
    const out = [];
    for (const L of lines) {
      const segs = segments(L); let buf = ''; const phys = [];
      for (const sg of segs) {
        const parts = sg.text.split('\n');
        parts.forEach((p, i) => { if (i > 0) { phys.push(buf); buf = ''; } if (p) buf += segHTML({ text: p, cls: sg.cls }); });
      }
      phys.push(buf);
      const inCur = cur >= L.start && cur <= L.end;
      phys.forEach((h, i) => {
        const cls = ['ln', inCur ? 'cur' : '', L.kind === 'error' && i === 0 ? 'err' : '', (L.kind === 'engine' || L.note && !L.error && (L.skipped || (S.ctx.items.find(x => x.L === L) || {}).engineOnly)) && i === 0 ? 'eng' : ''].filter(Boolean).join(' ');
        out.push(`<div class="${cls}" data-n="${L.start + i + 1}">${h || '<br>'}</div>`);
      });
    }
    while (out.length < nPhys) out.push(`<div class="ln" data-n="${out.length + 1}"><br></div>`);
    $('#hl').innerHTML = out.join('');
    ta.style.height = 'auto'; ta.style.height = ta.scrollHeight + 'px';
    // status + problems
    const items = S.ctx.items.filter(i => i.file === S.file);
    const omits = lines.filter(l => l.kind === 'omit').length;
    const errs = lines.filter(l => l.kind === 'error');
    const eng = lines.filter(l => l.kind === 'engine' || (S.ctx.items.find(x => x.L === l) || {}).engineOnly).length;
    $('#status').innerHTML = `<span><b>${items.length}</b> reminder${items.length === 1 ? '' : 's'}</span><span><b>${omits}</b> OMIT line${omits === 1 ? '' : 's'}</span>${eng ? `<span>◇ <b>${eng}</b> for the full engine</span>` : ''}${lines.orphan ? '<span>Not read from reminders.rem</span>' : ''}<span>${errs.length ? `<b style="color:var(--danger)">${errs.length} error${errs.length === 1 ? '' : 's'}</b>` : 'No errors'}</span>`;
    $('#problems').innerHTML = errs.map(l => `<button class="problem" data-act="jump" data-line="${l.start}"><b>Line ${l.start + 1}</b>${esc(l.error)}</button>`).join('');
    const ins = lineInspector(S.file, S.caretLine ?? 0);

  }
  function mountEditor() {
    const ta = $('#ed');

    ta.addEventListener('input', () => { S.files[S.file] = ta.value; S.caretLine = physLineOf(ta.value, ta.selectionStart); recompute(); paintEditor(); renderNav(); save(); });

  }
  function jumpTo(line) {
    const ta = $('#ed'); if (!ta) return;
    const P = ta.value.split('\n'); let pos = 0; for (let i = 0; i < line && i < P.length; i++) pos += P[i].length + 1;
    ta.focus({ preventScroll: true }); ta.setSelectionRange(pos, pos); S.caretLine = line; paintEditor();
    const el = $(`#hl .ln[data-n="${line + 1}"]`); if (el) el.scrollIntoView({ block: 'center', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
  }
  function insertAtCaret(text) {
    const ta = $('#ed'); if (!ta) return;
    const s = ta.selectionStart, e = ta.selectionEnd, v = ta.value;
    const pre = s > 0 && !/\s/.test(v[s - 1]) ? ' ' : '';
    const ins = pre + text + ' ';
    ta.setRangeText(ins, s, e, 'end'); ta.dispatchEvent(new Event('input')); ta.focus();
  }

  /* ---------------- sheets ---------------- */
  function openSheet(kind) { S.sheet = kind; renderSheet(); }
  function closeSheet() { S.sheet = null; S.compose = null; $('#sheet-root').innerHTML = ''; document.body.style.overflow = ''; if (S.sel && !desktop.matches) { S.sel = null; renderView(); } }
  function renderSheet() {
    const root = $('#sheet-root');
    if (!S.sheet) { root.innerHTML = ''; return; }
    let title = '', body = '';
    if (S.sheet === 'item') {
      const it = S.sel && findItem(S.sel.key); if (!it) { closeSheet(); return; }
      title = it.rem.todo ? 'Task' : 'Reminder'; body = itemDetail(it, S.sel.t);
    } else if (S.sheet === 'compose') { title = 'New reminder'; body = composeHTML(); }
    const keepFocus = document.activeElement && root.contains(document.activeElement) ? document.activeElement.id : null;
    root.innerHTML = `<div class="backdrop" data-act="backdrop"><section class="sheet" role="dialog" aria-modal="true" aria-label="${title}"><div class="grab"></div><div class="sheet-h"><h2>${title}</h2><button class="iconbtn" data-act="close" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>${body}</section></div>`;
    document.body.style.overflow = 'hidden';
    if (S.sheet === 'compose') { updateCompose(); const f = (keepFocus && $('#' + keepFocus)) || $('#qa'); f.focus(); if (f.id === 'qa') f.setSelectionRange(f.value.length, f.value.length); }
    else if (!keepFocus) { const cb = root.querySelector('[data-act="close"]'); if (cb) cb.focus({ preventScroll: true }); }
  }

  /* ---------------- compose ---------------- */
  const isRaw = t => /^\s*(REM|OMIT)\b/i.test(t);
  function openCompose() { S.compose = { text: '', model: Q.blank(T), file: 'reminders.rem', touched: false }; openSheet('compose'); }
  function composeLine() { const c = S.compose; return isRaw(c.text) ? c.text.trim() : Q.toRem(c.model, T); }
  const opt = (v, cur, lab) => `<option value="${v}"${String(v) === String(cur) ? ' selected' : ''}>${lab}</option>`;
  function tuneHTML() {
    const m = S.compose.model;
    const kinds = [['once', 'Once'], ['daily', 'Every day'], ['weekly', 'Weekly'], ['monthly-day', 'Monthly, on a date'], ['monthly-nth', 'Monthly, on a weekday'], ['monthly-last', 'Last day of the month'], ['monthly-lastwork', 'Last working day'], ['yearly', 'Yearly'], ['interval', 'Every N days']];
    let ctx = '';
    if (m.kind === 'once') ctx = `<div class="row"><label for="c-date">Date</label><input type="date" id="c-date" value="${K.iso(m.date)}"></div>`;
    if (m.kind === 'weekly') ctx = `<div class="row"><span class="lab">On</span><div class="seg wd">${[1, 2, 3, 4, 5, 6, 0].map(w => `<button type="button" data-act="wd" data-w="${w}" aria-pressed="${m.wds.includes(w)}" aria-label="${K.WD[w]}">${K.WDS[w].slice(0, 2)}</button>`).join('')}</div></div>`;
    if (m.kind === 'monthly-day') ctx = `<div class="row"><label for="c-day">Day</label><input type="number" id="c-day" min="1" max="31" value="${m.day}"></div>`;
    if (m.kind === 'monthly-nth') ctx = `<div class="row"><span class="lab">The</span><div class="inline"><select id="c-nth" aria-label="Which">${[1, 2, 3, 4].map(i => opt(i, m.nth, ['', 'First', 'Second', 'Third', 'Fourth'][i])).join('')}${opt('last', m.nth, 'Last')}</select><select id="c-nthwd" aria-label="Weekday">${[1, 2, 3, 4, 5, 6, 0].map(w => opt(w, m.nthWd, K.WD[w])).join('')}</select></div></div>`;
    if (m.kind === 'yearly') ctx = `<div class="row"><span class="lab">On</span><div class="inline"><input type="number" id="c-yday" min="1" max="31" value="${m.day}" aria-label="Day"><select id="c-month" aria-label="Month">${K.MO.map((x, i) => opt(i + 1, m.month, x)).join('')}</select></div></div>`;
    if (m.kind === 'interval') ctx = `<div class="row"><span class="lab">Every</span><div class="inline"><input type="number" id="c-int" min="1" value="${m.interval}" aria-label="Days between"><input type="date" id="c-start" value="${K.iso(m.date)}" aria-label="Starting on"></div></div>`;
    const durs = [[0, 'None'], [15, '15 min'], [30, '30 min'], [45, '45 min'], [60, '1 hour'], [90, '1½ hours'], [120, '2 hours'], [180, '3 hours']];
    if (m.duration && !durs.some(d => d[0] === m.duration)) durs.push([m.duration, K.durText(m.duration)]);
    return `<div class="form">
      <div class="row"><label for="c-msg">Message</label><input type="text" id="c-msg" value="${esc(m.msg)}" placeholder="What to remind you of"></div>
      <div class="row"><label for="c-kind">Repeats</label><select id="c-kind">${kinds.map(([v, l]) => opt(v, m.kind, l)).join('')}</select></div>
      ${ctx}
      <div class="row"><label for="c-time">Time</label><div class="inline"><input type="time" id="c-time" value="${m.time != null ? K.fmt24(m.time) : ''}"><select id="c-dur" aria-label="Duration">${durs.map(([v, l]) => opt(v, m.duration || 0, l)).join('')}</select></div></div>
      <div class="row"><label for="c-warn">Heads-up</label><div class="inline"><input type="number" id="c-warn" min="0" max="60" value="${m.warn}" aria-label="Days ahead"><label class="tick"><input type="checkbox" id="c-warnall"${m.warnAll ? ' checked' : ''}>Count days off</label></div></div>
      <div class="row"><span class="lab">On days off</span><div class="seg">${[['', 'Keep'], ['SKIP', 'Skip'], ['BEFORE', 'Day before'], ['AFTER', 'Day after']].map(([v, l]) => `<button type="button" data-act="omitmode" data-v="${v}" aria-pressed="${m.omitMode === v}">${l}</button>`).join('')}</div></div>
      ${m.kind !== 'once' ? `<div class="row"><label for="c-until">Ends</label><input type="date" id="c-until" value="${m.until != null ? K.iso(m.until) : ''}"></div>` : ''}
      <div class="row"><span class="lab">Options</span><div class="inline"><label class="tick"><input type="checkbox" id="c-todo"${m.todo ? ' checked' : ''}>It's a task (TODO)</label><label class="tick"><input type="checkbox" id="c-cd"${m.countdown ? ' checked' : ''}>Add countdown %b</label></div></div>
    </div>`;
  }
  function composeHTML() {
    const c = S.compose; const raw = isRaw(c.text);
    return `<label class="vh" for="qa">Describe the reminder</label>
      <input class="qa" id="qa" value="${esc(c.text)}" placeholder="Dentist next Thu 3:30pm, warn me 3 days before" autocomplete="off" autocapitalize="sentences">
      <p class="hint">Write it the way you'd say it, or type a REM line directly.</p>
      <div class="result" id="cres"></div>
      ${raw ? '' : `<details class="tune" id="tune"${c.tuneOpen ? ' open' : ''}><summary>Adjust</summary><div id="tunebody">${tuneHTML()}</div></details>`}
      <div class="compose-foot"><label class="vh" for="c-file">Add to file</label><select id="c-file">${Object.keys(S.files).map(f => opt(f, c.file, f)).join('')}</select><button class="btn primary" data-act="add" id="addbtn">Add reminder</button></div>`;
  }
  function updateCompose() {
    const c = S.compose; const line = composeLine();
    const L = standalone(line).find(l => l.kind !== 'blank');
    let html = `<pre class="remline">${L ? lineHTML(L) : esc(line)}</pre>`; let ok = false;
    if (!L) html += '';
    else if (L.kind === 'error') html += `<p class="lineerr">${esc(L.error)}</p>`;
    else if (L.rem) {
      L.rem.omitCtx = S.ctx.finalOmit; ok = true;
      const ex = L.omit && !L.rem ? K.explainOmit(L.omit) : K.explain(L.rem);
      const st = L.rem.todo ? todoStart(L.rem) : T;
      const nx = L.rem.engine.length ? [] : K.upcoming(L.rem, st, 5);
      html += `<ul class="explain">${ex.map(x => `<li>${esc(x)}</li>`).join('')}</ul>${nx.length ? `<div class="nextdates">${nx.map((n, i) => `<span class="${i === 0 ? 'first' : ''}">${K.fmtDateShort(n)}</span>`).join('')}</div>` : ''}`;
      if (!isRaw(c.text) && !c.model.msg) { ok = false; html += '<p class="lineok">Add a message to finish.</p>'; }
    } else if (L.kind === 'omit') { ok = true; html += `<ul class="explain">${K.explainOmit(L.omit).map(x => `<li>${esc(x)}</li>`).join('')}</ul>`; }
    else ok = true;
    $('#cres').innerHTML = html;
    const b = $('#addbtn'); if (b) b.disabled = !ok || (!c.text.trim() && !c.touched);
  }
  function composeInput(e) {
    const c = S.compose; if (!c) return;
    const id = e.target.id; const m = c.model; const v = e.target.value;
    const dateVal = s => { const r = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s); return r ? K.dnum(+r[1], +r[2], +r[3]) : null; };
    if (id === 'qa') {
      const wasRaw = isRaw(c.text); c.text = v;
      if (!isRaw(v)) { const keep = { file: c.file }; c.model = Q.parse(v, T); Object.assign(c, keep); }
      if (wasRaw !== isRaw(v)) { renderSheet(); return; }
      const tb = $('#tunebody'); if (tb) tb.innerHTML = tuneHTML();
      updateCompose(); return;
    }
    c.touched = true;
    switch (id) {
      case 'c-msg': m.msg = v; break;
      case 'c-kind': m.kind = v; if (v === 'weekly' && !m.wds.length) m.wds = [K.wday(m.date)]; if (v === 'yearly') { const q = K.ymd(m.date); m.day = q.d; m.month = q.m; } if (v === 'monthly-day') m.day = K.ymd(m.date).d; $('#tunebody').innerHTML = tuneHTML(); break;
      case 'c-date': case 'c-start': { const n = dateVal(v); if (n != null) m.date = n; break; }
      case 'c-day': m.day = Math.min(31, Math.max(1, +v || 1)); break;
      case 'c-yday': m.day = Math.min(31, Math.max(1, +v || 1)); break;
      case 'c-month': m.month = +v; break;
      case 'c-nth': m.nth = v === 'last' ? 'last' : +v; break;
      case 'c-nthwd': m.nthWd = +v; break;
      case 'c-int': m.interval = Math.max(1, +v || 1); break;
      case 'c-time': m.time = v ? K.parseTime(v) : null; break;
      case 'c-dur': m.duration = +v || null; break;
      case 'c-warn': m.warn = Math.max(0, +v || 0); break;
      case 'c-warnall': m.warnAll = e.target.checked; break;
      case 'c-until': m.until = dateVal(v); break;
      case 'c-todo': m.todo = e.target.checked; break;
      case 'c-cd': m.countdown = e.target.checked; break;
      case 'c-file': c.file = v; return;
      default: return;
    }
    updateCompose();
  }
  function addCompose() {
    const c = S.compose; const line = composeLine(); const file = c.file;
    snapshot();
    let txt = S.files[file]; if (txt.length && !txt.endsWith('\n')) txt += '\n';
    const lineNo = txt.split('\n').length - 1;
    S.files[file] = txt + line + '\n';
    S.sheet = null; S.compose = null; $('#sheet-root').innerHTML = ''; document.body.style.overflow = '';
    recompute();
    const it = S.ctx.items.find(i => i.file === file && i.L.start === lineNo);
    if (it && desktop.matches) S.sel = { key: keyOf(it), t: null };
    save(); render();
    toast(`Added to ${file}, line ${lineNo + 1}`, true);
  }

  /* ---------------- actions ---------------- */
  function markDone(key, t) {
    const it = findItem(key); if (!it) return;
    const L = it.L; const raw = L.raw; let nraw;
    const re = /\bCOMPLETED?-THROUGH(\s+)(\S+)/i;
    if (re.test(L.joined)) {
      const tk = L.tokens.find(x => /^COMPLETED?-THROUGH$/i.test(x.t));
      const dtk = L.tokens[L.tokens.indexOf(tk) + 1];
      let k = L.tokens.indexOf(tk) + 1; let last = null;
      while (L.tokens[k] && L.tokens[k].role === 'date') { last = L.tokens[k]; k++; }
      if (dtk && last) { const a = L.map[dtk.s], b = L.map[last.e - 1] + 1; nraw = raw.slice(0, a) + K.iso(t) + raw.slice(b); }
      else { const b = L.map[tk.e - 1] + 1; nraw = raw.slice(0, b) + ' ' + K.iso(t) + raw.slice(b); }
    } else {
      const BODY = new Set(['MSG', 'MSF', 'FMT', 'RUN', 'CAL', 'PS', 'PSFILE', 'SPECIAL', 'SATISFY']);
      const bk = L.tokens.find(x => x.role === 'kw' && BODY.has(x.t.toUpperCase())); if (!bk) return;
      const a = L.map[bk.s]; nraw = raw.slice(0, a) + 'COMPLETE-THROUGH ' + K.iso(t) + ' ' + raw.slice(a);
    }
    snapshot(); replaceLines(it.file, L.start, L.end, nraw);
    commitEdit(`Done through ${K.fmtDateShort(t)} · ${it.file.replace('.rem', '')}:${L.start + 1}`);
  }
  function setView(v, push = true) {
    if (!['today', 'month', 'script', 'sync'].includes(v)) v = 'today';
    S.view = v; if (push && location.hash !== '#' + v) { try { history.replaceState(null, '', '#' + v); } catch (e) { location.hash = v; } }
    if (v !== 'script') S.caretLine = S.caretLine ?? 0;
    renderNav(); renderView(); renderPanel();
    const main = $('#main'); if (main) main.scrollTop = 0; window.scrollTo(0, 0);
  }
  function openItem(key, t) {
    S.sel = { key, t };
    if (desktop.matches) { renderView(); renderPanel(); }
    else { renderView(); openSheet('item'); }
  }

  document.addEventListener('click', e => {
    const a = e.target.closest('[data-act]'); if (!a) return;
    const act = a.dataset.act;
    if (act === 'backdrop' && e.target !== a) return;
    switch (act) {
      case 'nav': if (S.sheet) closeSheet(); setView(a.dataset.view); break;
      case 'open': openItem(a.dataset.key, +a.dataset.t); break;
      case 'done': { e.stopPropagation(); a.classList.add('done'); const k = a.dataset.key, t = +a.dataset.t; setTimeout(() => { if (S.sheet === 'item') closeSheet(); markDone(k, t); }, 260); break; }
      case 'mprev': case 'mnext': { let { y, m } = S.month; m += act === 'mprev' ? -1 : 1; if (m < 1) { m = 12; y--; } if (m > 12) { m = 1; y++; } S.month = { y, m }; S.selDay = K.dnum(y, m, 1); renderView(); break; }
      case 'mtoday': { const { y, m } = K.ymd(T); S.month = { y, m }; S.selDay = T; renderView(); break; }
      case 'day': { S.selDay = +a.dataset.n; const q = K.ymd(S.selDay); if (q.m !== S.month.m) S.month = { y: q.y, m: q.m }; renderView(); break; }
      case 'file': S.file = a.dataset.file; S.caretLine = 0; if (S.view !== 'script') setView('script'); else renderView(); break;
      case 'ins': insertAtCaret(a.dataset.ins); break;
      case 'jump': jumpTo(+a.dataset.line); break;
      case 'goto': if (S.sheet) closeSheet(); S.file = a.dataset.file; S.pendingJump = +a.dataset.line; S.caretLine = +a.dataset.line; setView('script'); break;
      case 'compose': openCompose(); break;
      case 'close': case 'backdrop': closeSheet(); break;
      case 'wd': { const m = S.compose.model; const w = +a.dataset.w; m.wds = m.wds.includes(w) ? m.wds.filter(x => x !== w) : [...m.wds, w]; S.compose.touched = true; a.setAttribute('aria-pressed', m.wds.includes(w)); updateCompose(); break; }
      case 'omitmode': { S.compose.model.omitMode = a.dataset.v; S.compose.touched = true; a.parentElement.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b === a)); updateCompose(); break; }
      case 'add': addCompose(); break;
      case 'saveline': {
        const it = findItem(a.dataset.key); const ta = $('#lineedit'); if (!it || !ta) return;
        snapshot(); replaceLines(it.file, it.L.start, it.L.end, ta.value.replace(/\n+$/, ''));
        recompute(); const nit = S.ctx.items.find(i => i.file === it.file && i.L.start === it.L.start);
        S.sel = nit ? { key: keyOf(nit), t: null } : null; if (!nit && S.sheet) closeSheet();
        commitEdit(`Saved ${it.file} line ${it.L.start + 1}`); break;
      }
      case 'delline': {
        const it = findItem(a.dataset.key); if (!it) return;
        snapshot(); replaceLines(it.file, it.L.start, it.L.end, null); S.sel = null; if (S.sheet) closeSheet();
        commitEdit(`Deleted ${it.file} line ${it.L.start + 1}`); break;
      }
      case 'undo': if (S.undo) { S.files = S.undo; S.undo = null; save(); recompute(); render(); toast('Undone'); } break;
      case 'push': { const msgEl = $('#commitmsg'); const msg = msgEl ? msgEl.value.trim() || 'Update reminders' : ''; const sha = Math.random().toString(16).slice(2, 9); S.base = { ...S.files }; S.commitMsg = ''; save(); render(); toast(`Pushed ${sha} “${msg}” to main`); break; }
      case 'pull': toast('Already up to date with origin/main'); break;
      case 'connect': toast('Connecting accounts is turned off in this demo'); break;
      case 'reset': S.files = sampleFiles(); S.base = { ...S.files }; S.sel = null; S.undo = null; save(); recompute(); render(); toast('Demo reset to the sample vault'); break;
    }
  });
  document.addEventListener('input', e => {
    if (e.target.closest('#sheet-root .sheet') && S.compose) { if (e.target.tagName !== 'SELECT' && e.target.type !== 'checkbox') composeInput(e); return; }
    if (e.target.id === 'lineedit') {
      const it = findItem(e.target.dataset.key); const r = linePreview(e.target.value, it);
      $('#lineprev').innerHTML = r.html; $('#savebtn').disabled = !r.ok || e.target.value === (it && it.L.raw);
    }
    if (e.target.id === 'commitmsg') S.commitMsg = e.target.value;
  });
  document.addEventListener('change', e => { if (e.target.closest('#sheet-root .sheet') && S.compose && (e.target.tagName === 'SELECT' || e.target.type === 'checkbox')) composeInput(e); });
  document.addEventListener('toggle', e => { if (e.target.id === 'tune' && S.compose) S.compose.tuneOpen = e.target.open; }, true);
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && S.sheet) { closeSheet(); return; }
    if (e.key === 'Enter' && e.target.id === 'qa') { const b = $('#addbtn'); if (b && !b.disabled) addCompose(); return; }
    const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
    if (!typing && !S.sheet && e.key === 'n' && !e.metaKey && !e.ctrlKey) { e.preventDefault(); openCompose(); }
  });
  document.addEventListener('selectionchange', () => { const ta = $('#ed'); if (ta && document.activeElement === ta) { const l = physLineOf(ta.value, ta.selectionStart); if (l !== S.caretLine) { S.caretLine = l; paintEditor(); } } });
  window.addEventListener('hashchange', () => setView(location.hash.slice(1), false));
  desktop.addEventListener('change', () => { if (S.sheet === 'item') closeSheet(); render(); });

  /* ---------------- boot ---------------- */
  load(); recompute();
  S.view = ['today', 'month', 'script', 'sync'].includes(location.hash.slice(1)) ? location.hash.slice(1) : 'today';
  render();
  window.__kalends = { S, K, Q };
})();
</script>
