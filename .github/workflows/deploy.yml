name: Deploy to GitHub Pages

# Publishes only a commit that passed CI: this runs when the CI workflow
# finishes for a push to main, and deploys that run's commit if it succeeded.
# A run that failed or was cancelled (superseded by a newer push) deploys
# nothing. Run it by hand (Actions → Deploy to GitHub Pages → Run workflow) to
# redeploy main; it checks that main's latest commit passed CI first.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The commit CI passed, not whatever main is now.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Check that CI passed for this commit (manual runs)
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          conclusion=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${SHA}&event=push&per_page=1" \
            --jq '.workflow_runs[0].conclusion // "none"')
          if [ "$conclusion" != "success" ]; then
            echo "::error::CI has not passed for ${SHA} (latest run: ${conclusion}); not deploying."
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Remind as WebAssembly, built from engine/ by the same script and image as
      # in CI. Built here from the deployed commit so it matches that commit's
      # engine/BUILD-INFO.json.
      - name: Build the engine
        run: |
          if compgen -G 'engine/vendor/remind-*.tar.gz' > /dev/null; then
            engine/build.sh
            git diff --exit-code engine/BUILD-INFO.json
          else
            echo "::warning::No Remind tarball in engine/vendor/; deploying without the engine."
          fi

      # The site's base path as Pages serves it: /fasti at <user>.github.io,
      # nothing once a custom domain is set in Settings → Pages.
      - id: pages
        uses: actions/configure-pages@v6

      - name: Build
        run: npm run build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          # Repository Actions variables (docs/PLAN.md section 3.7). Each sign-in
          # button appears only when its variable is set.
          PUBLIC_WORKER_URL: ${{ vars.PUBLIC_WORKER_URL }}
          PUBLIC_GITHUB_CLIENT_ID: ${{ vars.PUBLIC_GITHUB_CLIENT_ID }}
          PUBLIC_GITHUB_APP_SLUG: ${{ vars.PUBLIC_GITHUB_APP_SLUG }}
          PUBLIC_GITLAB_CLIENT_ID: ${{ vars.PUBLIC_GITLAB_CLIENT_ID }}
          PUBLIC_BITBUCKET_CLIENT_ID: ${{ vars.PUBLIC_BITBUCKET_CLIENT_ID }}
          PUBLIC_DROPBOX_APP_KEY: ${{ vars.PUBLIC_DROPBOX_APP_KEY }}
          PUBLIC_ONEDRIVE_CLIENT_ID: ${{ vars.PUBLIC_ONEDRIVE_CLIENT_ID }}

      - name: Licences of shipped packages
        run: npm run licenses

      - uses: actions/upload-pages-artifact@v5
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
